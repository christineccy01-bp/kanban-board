services:
  backend:
    build: ./backend
    ports:
      - "4242:4242"
    env_file: ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time; the browser calls the backend directly
        NEXT_PUBLIC_API_URL: http://localhost:4242
    ports:
      - "3000:3000"
    depends_on:
      - backend
