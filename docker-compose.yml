services:
  backend:
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    build: ./backend
    ports:
      - "4242:4242"
    env_file: ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4242}
    ports:
      - "3000:3000"
    depends_on:
      - backend
